# screeningportal.co.uk static marketing site (moved from Vercel).
# Web root is the "current" release symlink written by /root/deploy-screeningportal.
# Install: /etc/nginx/sites-available/screeningportal.co.uk, snippet at
# /etc/nginx/snippets/screeningportal-headers.conf. Always: nginx -t && systemctl reload nginx.

# 1. Plain HTTP for both names: ACME challenges, then redirect to https://www.
server {
    listen 80;
    listen [::]:80;
    server_name screeningportal.co.uk www.screeningportal.co.uk;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://www.screeningportal.co.uk$request_uri; }
}

# 2. HTTPS apex: canonical redirect to www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name screeningportal.co.uk;
    ssl_certificate /etc/letsencrypt/live/screeningportal.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screeningportal.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/screeningportal-headers.conf;
    return 301 https://www.screeningportal.co.uk$request_uri;
}

# 3. HTTPS www: the site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.screeningportal.co.uk;
    root /var/www/screeningportal/current;
    index index.html;
    access_log /var/log/nginx/screeningportal.access.log;
    error_log  /var/log/nginx/screeningportal.error.log;

    ssl_certificate /etc/letsencrypt/live/screeningportal.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screeningportal.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/snippets/screeningportal-headers.conf; }

    # Parity with vercel.json: /index -> /
    location = /index { return 301 /; }

    # Never serve dotfiles (.git, .vercelignore) but allow ACME just in case.
    location ~ /\.(?!well-known) { return 404; }

    # Static assets: references carry ?v=, so cache hard. Bump ?v= on change.
    location ^~ /assets/ {
        include /etc/nginx/snippets/screeningportal-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(ico|png|svg|webmanifest|xml|txt)$ {
        include /etc/nginx/snippets/screeningportal-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Pages: always revalidate (matches Vercel's max-age=0).
    location / {
        include /etc/nginx/snippets/screeningportal-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
