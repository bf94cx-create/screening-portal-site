# Security headers for www.screeningportal.co.uk. Included inside every
# location that adds its own header, because a location-level add_header
# discards the server-level set. HSTS value matches what Vercel served.
add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
